<style>
  :root {
    --bg-primary: #f8f9fa;
    --card-bg: #ffffff;
    --text-primary: #1f2a24;
    --text-secondary: #6c757d;
    --accent-color: #2b5c46;
    --accent-light: #e8f0ec;
    --border-color: #e9ecef;
    --danger-color: #dc3545;
  }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
  }
  .card {
    background-color: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    border: 1px solid var(--border-color);
  }
  h1, h2 {
    margin-top: 0;
    color: var(--accent-color);
  }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    box-sizing: border-box;
  }
  button {
    background-color: var(--accent-color);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
  }
  button:hover {
    opacity: 0.9;
  }
  .spesa-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
  }
  .spesa-item:last-child {
    border-bottom: none;
  }
  .status-badge {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 12px;
    background-color: var(--accent-light);
    color: var(--accent-color);
  }
</style>

<!-- SDK Firebase (Versione Compatibile v9) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Libro Spese</h1>
    <div id="sync-status" class="status-badge">Connessione a Firebase in corso...</div>
  </div>

  <div class="card">
    <h2>Aggiungi Spesa</h2>
    <form id="spesa-form">
      <div class="form-group">
        <label for="descrizione">Descrizione</label>
        <input type="text" id="descrizione" required placeholder="Es. Spesa alimentari">
      </div>
      <div class="form-group">
        <label for="importo">Importo (€)</label>
        <input type="number" id="importo" step="0.01" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label for="tipo">Tipologia</label>
        <select id="tipo">
          <option value="comune">Spesa Comune</option>
          <option value="personale">Spesa Personale</option>
        </select>
      </div>
      <button type="submit">Salva Spesa</button>
    </form>
  </div>

  <div class="card">
    <h2>Elenco Spese</h2>
    <div id="lista-spese">Caricamento spese...</div>
  </div>
</div>

<script>
  // Configurazione Firebase del progetto "garage-diario"
  const firebaseConfig = {
    apiKey: "AIzaSyB_YOUR_REAL_API_KEY", // Incolla la tua vera API Key qui se differisce
    authDomain: "garage-diario.firebaseapp.com",
    projectId: "garage-diario",
    storageBucket: "garage-diario.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef1234567890"
  };

  // Inizializzazione Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const statusEl = document.getElementById('sync-status');
  const form = document.getElementById('spesa-form');
  const listaEl = document.getElementById('lista-spese');

  // Sincronizzazione in tempo reale con Firestore (collezione spese_famiglie)
  db.collection("spese_famiglie").orderBy("data", "desc").onSnapshot((snapshot) => {
    statusEl.innerText = "Sincronizzato con Firebase";
    listaEl.innerHTML = "";
    
    if (snapshot.empty) {
      listaEl.innerHTML = "<p>Nessuna spesa registrata.</p>";
      return;
    }

    snapshot.forEach((doc) => {
      const data = doc.data();
      const item = document.createElement("div");
      item.className = "spesa-item";
      item.innerHTML = `
        <div>
          <strong>${data.descrizione}</strong><br>
          <small>${data.tipo} - ${new Date(data.data).toLocaleDateString()}</small>
        </div>
        <div>
          <strong>€ ${parseFloat(data.importo).toFixed(2)}</strong>
        </div>
      `;
      listaEl.appendChild(item);
    });
  }, (error) => {
    console.error("Errore di sincronizzazione:", error);
    statusEl.innerText = "Errore di connessione a Firebase";
  });

  // Salvataggio nuova spesa su Firestore
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const descrizione = document.getElementById('descrizione').value;
    const importo = parseFloat(document.getElementById('importo').value);
    const tipo = document.getElementById('tipo').value;

    db.collection("spese_famiglie").add({
      descrizione: descrizione,
      importo: importo,
      tipo: tipo,
      data: new Date().toISOString()
    }).then(() => {
      form.reset();
    }).catch((error) => {
      alert("Errore durante il salvataggio della spesa: " + error.message);
    });
  });
</script>

</body>
</html>
